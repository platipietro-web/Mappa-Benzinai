name: mappa_prezzi_benzina
description: Modern fuel prices app for Italian gas stations.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1
  dartz: ^0.10.1

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # Maps & Location
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  location: ^8.0.1
  geolocator: ^14.0.2

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.1

  # UI & Design
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.7
  smooth_page_indicator: ^2.0.1

  # Utilities
  intl: ^0.20.2
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.1
  uuid: ^4.1.0

  # Navigation
  url_launcher: ^6.2.0

  # Connectivity
  connectivity_plus: ^7.1.1

  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/icons/logo.png
    - assets/brands/
